[build-system]
requires = ["setuptools>=69.0"]
build-backend = "setuptools.build_meta"

[project]
name = "countdown-timer-app"
version = "0.1.0"
description = "Local Flask countdown timer web application."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "Flask>=3.1.0,<4.0.0",
    "freezegun>=1.5.0",
]

[tool.setuptools.packages.find]
include = ["app*"]
exclude = ["tests*", "prompts", "static", "templates"]

[tool.setuptools]
include-package-data = true

[tool.setuptools.package-data]
"app" = ["static/**/*", "templates/**/*"]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.6.1",
    "black>=24.8.0",
    "pre-commit>=3.7.0",
    "pytest-playwright>=0.5.0",
]

[tool.pytest.ini_options]
addopts = "-ra -q"
testpaths = ["tests"]
markers = ["playwright: Playwright end-to-end tests."]

[tool.black]
line-length = 88
target-version = ["py312"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E203"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]
