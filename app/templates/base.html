<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{% block title %}Countdown Timer{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/main.css') }}">
</head>

<body>
  <header>
    <h1>Countdown Timer</h1>
    <p aria-live="polite">{% block tagline %}Keep every milestone front of mind.{% endblock %}</p>
  </header>

  <main>
    {% block content %}{% endblock %}
  </main>

  <footer>
    <p>Made for precise offline-friendly planning.</p>
  </footer>

  <script src="{{ url_for('static', filename='js/dayjs.min.js') }}" defer></script>
  <script src="{{ url_for('static', filename='js/dayjs-plugin-utc.js') }}" defer></script>
  {% block scripts %}{% endblock %}
</body>

</html>
